# ============================================================================
# mojobus.org — Legacy-Redirect-Vhost (WP-Rente, 301 → mojobus.co)
#
# Die alte WordPress-Seite ist stillgelegt. Dieser Vhost serviert KEINEN
# Content — er leitet nur weiter:
#
#   1. Exakt gematchte Alt-URLs (redirects/wp-redirects.map, generiert von
#      scripts/generate-wp-redirects.js) → 1-Hop-301 direkt aufs Ziel
#      (https://mojobus.co/<naddr>)
#   2. Alles andere (unmatchte Content-URLs, /?p=<id>) → Resolver-Endpoint
#      im ai-api (server/routes/wp-redirect.js) → 301 auf besten Artikel
#   3. WP-Systempfade + alte Uploads → 301 auf https://mojobus.co/ (HOME)
#
# ── Aktivierung (CentminMod, einmalig) ─────────────────────────────────────
# 1) Zertifikat (SAN: mojobus.org + www.mojobus.org), CentminMod/acmetool:
#      /usr/local/bin/acmetool.sh addon acme cert     # interaktiv Domain wählen
#    Erwartete Pfade (wie bei mojobus.co):
#      /usr/local/nginx/conf/ssl/mojobus.org/mojobus.org.crt.key.conf
#    Prüfen: openssl s_client -connect mojobus.org:443 -servername mojobus.org \
#      </dev/null 2>/dev/null | openssl x509 -noout -ext subjectAltName
# 2) Map generieren (im Repo-Checkout):
#      cd /root/deploy-git/mojobusco && node scripts/generate-wp-redirects.js
#    → redirects/wp-redirects.map ansehen + report.json prüfen (Trefferquote!)
# 3) Map + Vhost installieren:
#      cp redirects/wp-redirects.map /usr/local/nginx/conf/conf.d/wp-redirects.map
#      cp /usr/local/nginx/conf/conf.d/mojobus.org.ssl.conf \
#         /usr/local/nginx/conf/conf.d/mojobus.org.ssl.conf.bak
#      cp mojobus.org.ssl.conf /usr/local/nginx/conf/conf.d/mojobus.org.ssl.conf
#      nginx -t && systemctl reload nginx
# 4) ai-api neu starten (Endpoint muss laufen):
#      bash deploy-main.sh --force   # oder: systemctl restart ai-api
# 5) Verifizieren:
#      curl -sI https://mojobus.org/98632/oldtimer-reparatur-luna-zeit-fuer-neues/ | grep -i location
#      curl -sI "https://mojobus.org/?p=98632" | grep -i location
#      curl -sI https://mojobus.org/wp-content/uploads/2019/10/x.jpg | grep -i location
#      curl -sI https://mojobus.org/irgendein-alter-post/ | grep -i location
#
# DNS: A/AAAA mojobus.org (+ www) auf denselben Server wie mojobus.co.
# ============================================================================

# ── Statische Redirect-Map (generiert) ─────────────────────────────────────
# Datei: redirects/wp-redirects.map → /usr/local/nginx/conf/conf.d/mojobus.org.redirects.map
# (.map statt .conf, damit CentminMods *.conf-Glob die Datei NICHT eigenständig
# lädt — sie wird nur hier per include gelesen. Domain im Dateinamen für
# Eindeutigkeit, rvlove.co kriegt später eine eigene Map.)
#
# Hash-Größen: Die Map hat ~1900 Einträge mit langen URL-Keys — die Defaults
# (bucket 128) reichen nicht → nginx: [emerg] could not build map_hash.
# Muss VOR dem map-Block stehen (http-Kontext). Falls eine ANDERE conf.d-Datei
# diese Direktive ebenfalls setzt → "is duplicate" → dann hier raus und in
# nginx.conf http{} zentral setzen.
map_hash_bucket_size 512;
map_hash_max_size 16384;

# Format: "/<id>/<slug>/" https://mojobus.co/<naddr>;
map $request_uri $mojobus_wp_redirect {
    default "";
    include /usr/local/nginx/conf/conf.d/mojobus.org.redirects.map;
}

# ── HTTPS ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name mojobus.org www.mojobus.org;

    # Zertifikat muss mojobus.org UND www.mojobus.org im SAN haben!
    include /usr/local/nginx/conf/ssl/mojobus.org/mojobus.org.crt.key.conf;
    include /usr/local/nginx/conf/ssl_include.conf;

    access_log /home/nginx/domains/mojobus.org/log/access.log combined buffer=256k flush=5m;
    error_log /home/nginx/domains/mojobus.org/log/error.log;

    # WP-Systempfade — kein Content, kein Sinn in feinerer Auflösung
    location ^~ /wp-content/    { return 301 https://mojobus.co/; }
    location ^~ /wp-admin/      { return 301 https://mojobus.co/; }
    location ^~ /wp-includes/   { return 301 https://mojobus.co/; }
    location ^~ /wp-json/       { return 301 https://mojobus.co/; }
    location = /wp-login.php    { return 301 https://mojobus.co/; }
    location = /wp-cron.php     { return 410; }
    location = /xmlrpc.php      { return 410; }

    # Alte Upload-Bilder: 301 auf Homepage (Entscheidung 2026-09-08)
    location ^~ /wp-content/uploads/ { return 301 https://mojobus.co/; }

    # Alte Feeds/Robots auf die neuen Pendants
    location = /robots.txt   { return 301 https://mojobus.co/robots.txt; }
    location = /sitemap.xml  { return 301 https://mojobus.co/sitemap.xml; }
    location = /sitemap_index.xml { return 301 https://mojobus.co/sitemap.xml; }

    # Startseite direkt
    location = / { return 301 https://mojobus.co/; }

    # Alles andere: Map-Treffer → 1-Hop-301; Rest → Resolver (ai-api)
    location / {
        if ($mojobus_wp_redirect != "") {
            return 301 $mojobus_wp_redirect;
        }
        proxy_pass http://127.0.0.1:3002/api/wp-redirect?uri=$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}

# ── HTTP → gleiche Logik (kein doppelter Hop; Map/Resolver liefern https-Ziel)
server {
    listen 80;
    server_name mojobus.org www.mojobus.org;

    access_log /home/nginx/domains/mojobus.org/log/access.log combined buffer=256k flush=5m;
    error_log /home/nginx/domains/mojobus.org/log/error.log;

    location ^~ /wp-content/    { return 301 https://mojobus.co/; }
    location ^~ /wp-admin/      { return 301 https://mojobus.co/; }
    location ^~ /wp-includes/   { return 301 https://mojobus.co/; }
    location ^~ /wp-json/       { return 301 https://mojobus.co/; }
    location = /wp-login.php    { return 301 https://mojobus.co/; }
    location = /wp-cron.php     { return 410; }
    location = /xmlrpc.php      { return 410; }
    location ^~ /wp-content/uploads/ { return 301 https://mojobus.co/; }
    location = /robots.txt      { return 301 https://mojobus.co/robots.txt; }
    location = /sitemap.xml     { return 301 https://mojobus.co/sitemap.xml; }
    location = /sitemap_index.xml { return 301 https://mojobus.co/sitemap.xml; }
    location = /                { return 301 https://mojobus.co/; }

    location / {
        if ($mojobus_wp_redirect != "") {
            return 301 $mojobus_wp_redirect;
        }
        proxy_pass http://127.0.0.1:3002/api/wp-redirect?uri=$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
