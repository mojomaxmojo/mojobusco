<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Vanlife, Reisen und Abenteuer mit dem MojoBus. Perpetual Travelers Blog – Unser Leben am Meer, offgrid, Solar & Geschichten vom Strand." />
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/fonts.css">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/icon-192x192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- WICHTIG (SEO-Fix 2026-10): KEIN hardcodiertes Canonical hier. -->
    <!-- Die SPA setzt routenabhängige Canonicals via @unhead/react (useHead) —  -->
    <!-- ein Shell-Canonical auf / hätte alle Artikel-URLs als Startseite       -->
    <!-- ausgewiesen, sobald ein Crawler das statische HTML ohne JS liest.      -->

    <!-- Preconnect für wichtige Drittanbieter-Domains -->
    <link rel="preconnect" href="https://relay.mojobus.co" />
    <link rel="preconnect" href="https://blossom.primal.net" />
    <link rel="preconnect" href="https://images.weserv.nl" />
    <link rel="preconnect" href="wss://relay.mojobus.co" />
    <link rel="dns-prefetch" href="https://relay.mojobus.co" />
    <link rel="dns-prefetch" href="https://blossom.primal.net" />
    <link rel="dns-prefetch" href="https://images.weserv.nl" />
    <link rel="dns-prefetch" href="wss://relay.mojobus.co" />

    <!-- Preload kritischer Fonts (LCP-Optimierung) -->
    <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfair-display-regular.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Preload Logo (LCP-Element) -->
    <link rel="preload" href="/mojobuslogo.png" as="image" fetchpriority="high" />

    <!-- ═════════════════════════════════════════════════════════════ -->
    <!-- STATIC HERO (Variante A) – LCP-Fix: Der Hero rendert sofort   -->
    <!-- mit dem HTML, BEFORE irgendein JS lädt. Sitespeed zeigte      -->
    <!-- 2.0s "Element render delay" für das H1 (JS-gated Render).     -->
    <!-- Das Markup unten ist 1:1 identisch mit dem React-Hero in      -->
    <!-- src/pages/Home.tsx – createRoot() ersetzt es beim Mount       -->
    <!-- durch das identische React-DOM → kein sichtbarer Sprung.      -->
    <!-- ═════════════════════════════════════════════════════════════ -->

    <!-- Theme-Bootstrap: Setzt light/dark Klasse VOR dem First Paint  -->
    <!-- (gleiche Logik wie AppProvider.useApplyTheme, gleiche Storage- -->
    <!-- Key wie AppProvider storageKey="nostr:app-config")             -->
    <script>
      (function () {
        try {
          var cfg = JSON.parse(localStorage.getItem('nostr:app-config') || '{}');
          var t = cfg && ['dark', 'light', 'system'].includes(cfg.theme) ? cfg.theme : 'light';
          if (t === 'system') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.add(t);
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <style>
      /* Theme-Variablen (Werte 1:1 aus src/index.css) */
      :root {
        --sh-bg: hsl(200 60% 98%);
        --sh-fg: hsl(210 30% 15%);
        --sh-muted-fg: hsl(215 20% 50%);
        --sh-primary: hsl(188 88% 42%);
        --sh-primary-fg: hsl(0 0% 100%);
        --sh-border: hsl(200 30% 90%);
      }
      html.dark {
        --sh-bg: hsl(215 40% 7%);
        --sh-fg: hsl(210 20% 98%);
        --sh-muted-fg: hsl(215 15% 65%);
        --sh-primary: hsl(188 88% 55%);
        --sh-primary-fg: hsl(215 40% 7%);
        --sh-border: hsl(215 40% 18%);
      }
      html, body {
        margin: 0;
        background: var(--sh-bg);
        color: var(--sh-fg);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .gradient-text {
        background: linear-gradient(135deg, hsl(188 88% 42%), hsl(349 83% 51%));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      html.dark .gradient-text {
        background: linear-gradient(135deg, hsl(188 88% 55%), hsl(349 83% 60%));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      /* Hero-Layout (entspricht section/px-4/container/max-w-5xl/space-y) */
      .sh-hero { position: relative; padding: 1.5rem 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      .sh-hero-bg1 { position: absolute; inset: 0; background: linear-gradient(to bottom right, hsl(188 88% 42% / .3), hsl(349 83% 51% / .2), var(--sh-bg)); }
      .sh-hero-bg2 { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent, hsl(200 60% 98% / .4), var(--sh-bg)); }
      html.dark .sh-hero-bg1 { background: linear-gradient(to bottom right, hsl(188 88% 55% / .3), hsl(349 83% 60% / .2), var(--sh-bg)); }
      html.dark .sh-hero-bg2 { background: linear-gradient(to bottom, transparent, hsl(215 40% 7% / .4), var(--sh-bg)); }
      .sh-container { position: relative; z-index: 10; width: 100%; margin: 0 auto; padding: 0 1rem; box-sizing: border-box; }
      .sh-inner { max-width: 64rem; margin: 0 auto; text-align: center; }
      .sh-inner > * + * { margin-top: 1.25rem; }
      .sh-text > * + * { margin-top: 1rem; }
      .sh-h1 { margin: 0; font-size: 3.75rem; font-weight: 700; letter-spacing: -0.025em; line-height: 1.25; }
      .sh-h2 { margin: 0; font-size: 1.875rem; font-weight: 400; font-family: 'Playfair Display', serif; color: var(--sh-muted-fg); line-height: 1.625; }
      .sh-tagline { margin: 0 auto; max-width: 42rem; font-size: 1.25rem; line-height: 1.75rem; color: var(--sh-muted-fg); }
      .sh-ctas { padding-top: 1.5rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 1.25rem; }
      .sh-btn {
        display: inline-flex; align-items: center; gap: 0.75rem;
        font-size: 1rem; font-weight: 500; line-height: 1.5rem;
        padding: 1.5rem 2rem; border-radius: 0.75rem; cursor: pointer;
      }
      .sh-btn svg { width: 1.5rem; height: 1.5rem; flex-shrink: 0; }
      .sh-btn-primary { background: var(--sh-primary); color: var(--sh-primary-fg); border: none; text-decoration: none; box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1); }
      .sh-btn-outline { background: transparent; color: var(--sh-fg); border: 1px solid var(--sh-border); }
      @media (min-width: 768px) {
        .sh-h1 { font-size: 6rem; }
        .sh-h2 { font-size: 3rem; }
        .sh-tagline { font-size: 1.5rem; line-height: 2rem; }
        .sh-container { max-width: 768px; }
      }
      @media (min-width: 640px) { .sh-container { max-width: 640px; } }
      @media (min-width: 1024px) { .sh-container { max-width: 1024px; } }
      @media (min-width: 1280px) { .sh-container { max-width: 1280px; } }
    </style>

    <!-- EN-Shell: Hero-Texte für /en/ tauschen (i18n: src/config/i18n/home.ts) -->
    <script>
      (function () {
        if (!location.pathname.startsWith('/en')) return;
        document.addEventListener('DOMContentLoaded', function () {
          var h2 = document.querySelector('.sh-h2');
          var p = document.querySelector('.sh-tagline');
          var a = document.querySelector('.sh-btn-primary');
          if (h2) h2.textContent = 'Our Life by the Ocean';
          if (p) p.textContent = 'Stories, tips and insights into our life between sand and horizon';
          if (a) a.lastChild.textContent = ' Discover Our Stories';
        });
      })();
    </script>

    <!-- ═══════════════════════════════════════════════ -->

    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"MojoBus – Perpetual Travelers","url":"https://mojobus.co"}</script>

  </head>
  <body>
    <div id="root">
      <!-- STATIC HERO: 1:1 identisch mit src/pages/Home.tsx (Variante A).
           createRoot().render() ersetzt diesen Block beim Mount durch das

      <section class="sh-hero">
