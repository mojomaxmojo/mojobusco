<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP deaktiviert für Debug -->
    <title>MojoBus Test</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/fonts.css">
    <!-- Favicon etc. minimal -->
    <link rel="icon" href="/favicon.ico">

    <!-- ═══════════════════════════════════════════════ -->
    <!-- PINTEREST RICH PIN META TAGS -->
    <!-- ═══════════════════════════════════════════════ -->
    <meta name="pinterest-rich-pin" content="true" />

    <!-- Open Graph (Pinterest benötigt OG-Tags) -->
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Perpetual Travelers" />
    <meta property="og:locale" content="de_DE" />
    <meta name="twitter:card" content="summary" />

    <!-- Artikel-spezifische OG-Tags (werden server-seitig für Bots überschrieben) -->
    <meta property="og:title" content="Perpetual Travelers – Unser Leben am Meer" />
    <meta property="og:description" content="Geschichten, Tipps und Einblicke in unser Leben zwischen Sand und Horizont. Vanlife, Offgrid, Solar & Abenteuer." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
