# security-headers.conf – zentrale Security-Header für mojobus.co (Fix #5)
# Ablageort auf dem VPS (Centminmod):
#   cp security-headers.conf /usr/local/nginx/conf/security-headers.conf
# Inkludiert in Locations mit eigenen add_header-Direktiven (nginx-Gotcha):
#   - location ~* \.(html|htm)$
#   - location @prerender_resolve

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HSTS: bewusst OHNE includeSubDomains – relay.mojobus.co etc. erst
# aufnehmen, wenn ALLE Subdomains dauerhaft TLS nutzen.
add_header Strict-Transport-Security "max-age=31536000" always;

add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

# Phase 1: CSP nur Report-Only (nichts wird blockiert) – 1-2 Wochen
# Error-Logs beobachten, dann auf erzwingendes Content-Security-Policy umstellen.
# unsafe-inline nötig wegen Critical-CSS/JSON-LD in index.html.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss: https:; font-src 'self' data:; frame-ancestors 'self'" always;
