# ============================================================
# PRERENDER – ERGÄNZUNG für mojobus.co.ssl.conf
# ============================================================
# Block 1: NEU – zwischen Cache-Blöcke und location / einfügen
# Block 2: ERSETZT den bestehenden location / Block
# ============================================================

# ── Block 1  (NEU) ──────────────────────────────────────────
  location /prerender/ {
      alias /home/nginx/domains/mojobus.co/public/prerender/;
      expires 1d;
      add_header Cache-Control "public, no-transform";
  }

# ── Block 2  (ERSETZT bestehenden location /) ────────────────
  location / {
      if ($is_bot = 1) {
          rewrite ^/articles/(.+)$ /prerender/articles/$1.html break;
      }
      try_files $uri $uri/ /index.html;
      include /usr/local/nginx/conf/block.conf;
  }