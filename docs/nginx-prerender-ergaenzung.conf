# ============================================================
# PRERENDER – ERGÄNZUNG für mojobus.co.ssl.conf
# ============================================================
#
# Block 1: Ersetzt den bestehenden location / Block.
#   - Neue Bot-Rewrites für Hauptseiten (/, /artikel, /artikel/leon, ...)
#   - Bestehende NIP-19 Rewrites bleiben
#
# Block 2: Der /prerender/ location Block bleibt (funktioniert bereits).
#
# Anwendung:
#   cp mojobus.co.ssl.conf mojobus.co.ssl.conf.bak
#   # Dann den location / Block ersetzen und nginx reload
# ============================================================

# ── NEU: Ersetze den gesamten location / Block ──────────────────────────
location / {
    if ($is_bot = 1) {
        # ── Hauptseiten ─────────────────────────────────────────
        rewrite ^/$ /prerender/index.html break;
        rewrite ^/artikel$ /prerender/artikel.html break;
        rewrite ^/artikel/leon$ /prerender/artikel-leon.html break;
        rewrite ^/artikel/diy$ /prerender/artikel-diy.html break;
        rewrite ^/artikel/rvlife$ /prerender/artikel-rvlife.html break;
        rewrite ^/plaetze$ /prerender/plaetze.html break;
        rewrite ^/bilder$ /prerender/bilder.html break;
        rewrite ^/notes$ /prerender/notes.html break;

        # ── NIP-19 Einzelseiten (bestehend) ─────────────────────
        rewrite ^/(naddr1[0-9a-z]+)$ /prerender/$1.html break;
        rewrite ^/(note1[0-9a-z]+)$ /prerender/$1.html break;
        rewrite ^/(npub1[0-9a-z]+)$ /prerender/$1.html break;
        rewrite ^/trip/(naddr1[0-9a-z]+)$ /prerender/trip-$1.html break;
        rewrite ^/bild/(note1[0-9a-z]+)$ /prerender/bild-$1.html break;
    }
    try_files $uri $uri/ /index.html;
}

# ── BESTEHEND: Prerender Cache (bleibt unverändert) ────────────────────
# location ^~ /prerender/ { ... } – bereits vorhanden, nichts ändern